apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-backend-deployment
spec:
  replicas: 4
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: yatindora/k8s-backend-multi-arch:14
        ports:
        - containerPort: 3000
        env:
          - name: DB_URL
            value: "postgres://postgres:mysecretpassword@db-service.default.svc.cluster.local:5432"