apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: yatindora/k8s-frontend-multi-arch:13
        ports:
        - containerPort: 5173
        env:
          - name: VITE_BASE_URL
            value: "http://localhost:30008"
            # value: "http://backend-service.default.svc.cluster.local:3000"