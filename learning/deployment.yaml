apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx-deployment
spec:
  replicas: 6
  selector:
    matchLabels:
      app: find-nginx
  template:
    metadata:
      labels:
        app: find-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80